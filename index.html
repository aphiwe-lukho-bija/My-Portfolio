<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Aphiwe Lukho Bija — aspiring software development intern."
    />
    <title>Aphiwe Lukho Bija — Portfolio</title>

    <!-- set the theme before the first paint so there is no flash of the
         wrong colours. SiteNav.vue keeps this value in sync afterwards. -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
